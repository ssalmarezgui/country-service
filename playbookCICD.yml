---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
    image_tag: v1
    dockerfile_path: './'

  tasks:
    - name: Log in to Docker Hub
      ansible.builtin.shell:
        cmd: "echo '{{ dockerhub_password }}' | docker login -u '{{ dockerhub_username }}' --password-stdin"

    - name: Build Docker image
      ansible.builtin.command:
        cmd: "docker build -t {{ dockerhub_username }}/{{ image_name }}:{{ image_tag }} {{ dockerfile_path }}"

    - name: Push the Docker image to Docker Hub
      ansible.builtin.command:
        cmd: "docker push {{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"

    - name: Pull Docker image (optional, for verification or on target nodes)
      ansible.builtin.command:
        cmd: "docker pull {{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"

    - name: Apply Kubernetes Deployment
      ansible.builtin.command:
        cmd: "kubectl apply -f deployment.yaml --kubeconfig=config -n salma-env"

    - name: Apply Kubernetes Service
      ansible.builtin.command:
        cmd: "kubectl apply -f service.yaml --kubeconfig=config -n salma-env"
