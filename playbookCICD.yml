---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
    image_tag: v1
    dockerfile_path: './'

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: yes

    - name: Build Docker image
      community.docker.docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"
        source: build
        state: present

    - name: Push the Docker image to Docker Hub
      ansible.builtin.command:
        cmd: "docker push {{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"

    - name: Apply Kubernetes Deployment
      ansible.builtin.command:
        cmd: "kubectl apply -f deployment.yaml --kubeconfig=config"

    - name: Apply Kubernetes Service
      ansible.builtin.command:
        cmd: "kubectl apply -f service.yaml --kubeconfig=config"
