apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-country-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-country-service
  template:
    metadata:
      labels:
        app: my-country-service
    spec:
      containers:
        - name: my-country-service-container
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
