apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-country-service-deployement
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-country-service-deployement
  template:
    metadata:
      labels:
        app: my-country-service-deployement
    spec:
      containers:
        - name: my-country-service
          image: majdaaa/my-compte-service:v1
          ports:
            - containerPort: 8082
